[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icps-counterfactual-red-teaming"
version = "0.2.1"
description = "Physically feasible counterfactual red-teaming for autonomous ICPS responders"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
icps-counterfactual = "icps_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
